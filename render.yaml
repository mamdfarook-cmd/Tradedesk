# Render Blueprint: Render reads this file when you choose New → Blueprint and pick this repository.
# APP_PASSWORD is asked for once at creation (sync: false keeps it out of the repository).
services:
  - type: web
    name: tradedesk
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /auth/login
    envVars:
      - key: APP_PASSWORD
        sync: false
      - key: NODE_ENV
        value: production
      # Random secret for login cookies and background-alert keys (Render generates it once, free).
      - key: APP_SECRET
        generateValue: true
      # Optional: Angel One SmartAPI (live premiums / indices / India VIX) - see SMARTAPI-SETUP.txt. Leave empty to skip.
      - key: SMARTAPI_API_KEY
        sync: false
      # Optional automatic daily login (see SMARTAPI-SETUP.txt): client ID, PIN, TOTP secret key.
      - key: SMARTAPI_CLIENT_CODE
        sync: false
      - key: SMARTAPI_PIN
        sync: false
      - key: SMARTAPI_TOTP_SECRET
        sync: false
      # Optional: TD_SCREENER_CANDLES = angel (screener candles from Angel One), TD_LIVE_PRICES = yahoo (live prices from Yahoo).
      - key: TD_SCREENER_CANDLES
        sync: false
      - key: TD_LIVE_PRICES
        sync: false
      # The site's own address (Angel One's login comes back to APP_URL/api/smartapi/callback).
      - key: APP_URL
        sync: false
